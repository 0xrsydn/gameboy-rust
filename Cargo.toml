[package]
name = "gba-rust"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:minifb"]

[dependencies]
# Pinned because src/desktop.rs corrects a macOS focus bug in this version.
minifb = { version = "=0.28.0", optional = true, default-features = false, features = ["x11"] }

[[bin]]
name = "gba-rust"
path = "src/main.rs"
required-features = ["desktop"]
