[package]
name = "gba-eval"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "GBA Eval benchmark ABI: this emulator as a wasm32 cdylib (gba_emu.wasm)"

[lib]
# The benchmark loads target/wasm32-unknown-unknown/release/gba_emu.wasm.
name = "gba_emu"
crate-type = ["cdylib", "rlib"]

[dependencies]
gba-core = { path = "../gba-core" }
